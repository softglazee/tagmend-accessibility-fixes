name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: Workflow lint (actionlint)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run actionlint 1.7.12
        run: docker run --rm -v "$GITHUB_WORKSPACE:/repo" -w /repo rhysd/actionlint@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667 -color

  phpcs:
    name: PHPCS (WordPress, WordPress-Docs, PHPCompatibilityWP 7.4+)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          coverage: none
          tools: composer:v2

      - name: Install the development packages (composer.lock)
        run: composer install --no-interaction --no-progress

      - name: Run PHPCS with phpcs.xml.dist
        run: vendor/bin/phpcs -s --report-width=200

  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }}, WordPress ${{ matrix.wp }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - php: '8.3'
            wp: '7.1.3'
          - php: '7.4'
            wp: '6.5.13'
          - php: '8.4'
            wp: '7.1.3'
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      WP_VERSION: ${{ matrix.wp }}
      SGL_DB_HOST: 127.0.0.1:3306
      SGL_DB_USER: root
      SGL_DB_PASSWORD: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli, mbstring
          coverage: none
          tools: composer:v2

      - name: Check the syntax of every PHP file
        run: find tagmend-accessibility-fixes tests tools -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l

      - name: Install the development packages (composer.lock)
        run: composer install --no-interaction --no-progress

      - name: Download WordPress and its test library (tools/setup-dev.sh)
        run: sh tools/setup-dev.sh --no-composer --wp "$WP_VERSION"

      - name: Create the test databases
        run: |
          php <<'PHP'
          <?php
          $db = new mysqli( '127.0.0.1', 'root', '', '', 3306 );
          foreach ( array( 'wptests71', 'wptests65' ) as $name ) {
              $db->query( 'CREATE DATABASE IF NOT EXISTS ' . $name ) || exit( 1 );
              echo "created {$name}\n";
          }
          PHP

      - name: Run PHPUnit
        run: sh tools/run-tests.sh --wp "$WP_VERSION"

  build:
    name: Build and audit the plugin ZIP
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build with tools/build-zip.ps1 -Strict
        shell: pwsh
        run: ./tools/build-zip.ps1 -Strict

      - name: Audit the ZIP against the plugin folder
        run: |
          python3 tools/audit-zip.py dist/tagmend-accessibility-fixes.zip
          unzip -l dist/tagmend-accessibility-fixes.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tagmend-accessibility-fixes-zip
          path: dist/tagmend-accessibility-fixes.zip
          if-no-files-found: error
          retention-days: 30

  plugin-check:
    name: Plugin Check on the installed ZIP
    needs: build
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: '1'
          MARIADB_DATABASE: wordpress
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    env:
      WP_CLI_VERSION: '2.12.0'
      WP_CLI_SHA256: 'ce34ddd838f7351d6759068d09793f26755463b4a4610a5a5c0a97b68220d85c'
      WP_VERSION: '7.1.5'
      PLUGIN_CHECK_VERSION: '2.2.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.3'
          extensions: mysqli, mbstring
          coverage: none
          tools: none

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tagmend-accessibility-fixes-zip
          path: dist

      - name: Install WP-CLI
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          curl -sSfL -o "$RUNNER_TEMP/bin/wp" "https://github.com/wp-cli/wp-cli/releases/download/v$WP_CLI_VERSION/wp-cli-$WP_CLI_VERSION.phar"
          echo "$WP_CLI_SHA256  $RUNNER_TEMP/bin/wp" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/bin/wp"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install WordPress and Plugin Check
        run: |
          mkdir -p "$RUNNER_TEMP/wordpress"
          cd "$RUNNER_TEMP/wordpress"
          wp core download --version="$WP_VERSION"
          wp config create --dbname=wordpress --dbuser=root --dbhost=127.0.0.1:3306 --skip-check
          wp config set WP_DEBUG true --raw
          wp config set WP_DEBUG_LOG true --raw
          wp config set WP_DEBUG_DISPLAY false --raw
          wp core install --url=http://localhost --title="Plugin Check" --admin_user=admin --admin_password="$(openssl rand -hex 16)" --admin_email=admin@example.org --skip-email
          wp plugin install plugin-check --version="$PLUGIN_CHECK_VERSION" --activate
          wp core version

      - name: Run Plugin Check (tools/plugin-check.sh)
        run: |
          cd "$RUNNER_TEMP/wordpress"
          sh "$GITHUB_WORKSPACE/tools/plugin-check.sh" "$GITHUB_WORKSPACE/dist/tagmend-accessibility-fixes.zip"

      - name: No notice, warning or error from the plugin in debug.log
        run: |
          log="$RUNNER_TEMP/wordpress/wp-content/debug.log"
          if [ -f "$log" ] && grep -n -E 'tagmend-accessibility-fixes|softglaze_a11y|SoftGlaze\\AccessibilityRepair' "$log"; then
            echo "The plugin wrote to debug.log."
            exit 1
          fi
          echo "debug.log: $( [ -f "$log" ] && wc -l < "$log" || echo 0 ) lines, none from the plugin"
